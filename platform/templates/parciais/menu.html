{% load static %}
{% load i18n %}
<header class="bg-transparent w-full fixed top-0 left-0 z-50 transition duration-800 ease-in-out h-[7rem] space-grotesk" id="navbar" style="top: -2px;">
    <nav class="container mx-auto flex justify-between items-center px-6 md:px-4 py-5 h-full max-w-7xl">
        <button id="menu-toggle" class="flex items-center md:hidden focus:outline-none">
            <span class="material-symbols-outlined text-white text-4xl">menu</span>
        </button>

        <a href="#" class="md:flex-grow-0 mx-auto md:mx-0 md:ml-4 flex justify-center items-center w-2xl">
            <img src="{% static 'assets/logo.png' %}" alt="School Logo" class="h-14 md:h-16" />
        </a>

        <a href="https://www.instagram.com/marcela_vitor_learning_center?igsh=c3FqOGNyYnc5Z2Rn" target="_blank" class="md:hidden text-3xl text-white mr-2 flex justify-center">
            <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
        </a>

        <nav class="hidden md:flex flex-grow justify-center space-x-12 font-semibold uppercase text-base text-white space-grotesk-light">
            <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 space-grotesk-light">{% trans "Home" %}</a>
            <a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 transition-colors space-grotesk-light">{% trans "About Us" %}</a>
            <a href="{% url 'programs' %}" class="{% if request.resolver_match.url_name == 'programs' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 transition-colors space-grotesk-light">{% trans "Programs" %}</a>
            <a href="{% url 'schedule' %}" class="{% if request.resolver_match.url_name == 'schedule' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 transition-colors space-grotesk-light">{% trans "Schedule a Visit" %}</a>
            <a href="{% url 'resume' %}" class="{% if request.resolver_match.url_name == 'resume' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 transition-colors space-grotesk-light">{% trans "Careers" %}</a>
        </nav>

        <div class="hidden md:flex items-center flex-shrink-0">
            <div class="language-selector flex space-x-2 ml-4">
                <button id="en-flag" class="flag-btn w-8 h-6 rounded-sm overflow-hidden border-2 border-white/30 hover:border-white transition-all duration-200 {% if LANGUAGE_CODE == 'en' %}ring-2 ring-white{% endif %}">
                    <img src="{% static 'assets/flags/usa.png' %}" alt="English" class="w-full h-full object-cover">
                </button>
                <button id="pt-flag" class="flag-btn w-8 h-6 rounded-sm overflow-hidden border-2 border-white/30 hover:border-white transition-all duration-200 {% if LANGUAGE_CODE == 'pt-br' %}ring-2 ring-white{% endif %}">
                    <img src="{% static 'assets/flags/brasil.jpg' %}" alt="Português" class="w-full h-full object-cover">
                </button>
            </div>
        </div>
    </nav>

    <ul id="mobile-menu" class="md:hidden flex flex-col items-center space-y-6 mt-4 py-6 absolute w-full top-20 hidden z-40 font-semibold uppercase text-base space-grotesk-light">
        <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 space-grotesk-light">{% trans "Home" %}</a></li>
        <li><a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 transition-colors space-grotesk-light">{% trans "About Us" %}</a></li>
        <li><a href="{% url 'programs' %}" class="{% if request.resolver_match.url_name == 'programs' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 transition-colors space-grotesk-light">{% trans "Programs" %}</a></li>
        <li><a href="{% url 'schedule' %}" class="{% if request.resolver_match.url_name == 'schedule' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 transition-colors space-grotesk-light">{% trans "Schedule a Visit" %}</a></li>
        <li><a href="{% url 'resume' %}" class="{% if request.resolver_match.url_name == 'resume' %}border-b-2 border-white{% else %}hover:border-b-2 hover:border-white{% endif %} pb-1 transition-colors space-grotesk-light">{% trans "Careers" %}</a></li>
        <li class="flex space-x-4 mt-4">
            <button id="en-flag-mobile" class="flag-btn w-10 h-7 rounded-sm overflow-hidden border-2 border-white/30 hover:border-white transition-all duration-200 {% if LANGUAGE_CODE == 'en' %}ring-2 ring-white{% endif %}">
                <img src="{% static 'assets/flags/usa.png' %}" alt="English" class="w-full h-full object-cover">
            </button>
            <button id="pt-flag-mobile" class="flag-btn w-10 h-7 rounded-sm overflow-hidden border-2 border-white/30 hover:border-white transition-all duration-200 {% if LANGUAGE_CODE == 'pt-br' %}ring-2 ring-white{% endif %}">
                <img src="{% static 'assets/flags/brasil.jpg' %}" alt="Português" class="w-full h-full object-cover">
            </button>
        </li>
    </ul>
</header>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $('#menu-toggle').on('click', function() {
        $('#mobile-menu').toggleClass('hidden');
        
        if (!$('#mobile-menu').hasClass('hidden')) {
            $('#navbar').css({
                'background': navbarScrollColor,
                'box-shadow': '0 2px 16px rgba(0,0,0,0.08)',
                'transition': 'background 0.4s, box-shadow 0.4s'
            });
            
            $('#mobile-menu').css({
                'background': navbarScrollColor,
                'transition': 'background 0.4s'
            });
            
            $('#menu-toggle span').css({
                'color': 'var(--school-text-color-dark)',
                'transition': 'color 0.4s'
            });
            
            $('.md\\:hidden svg').css({
                'color': 'var(--school-text-color-dark)',
                'transition': 'color 0.4s'
            });
            
            $('.md\\:flex a').css({
                'color': menuItemScrollColor,
                'transition': 'color 0.4s',
                'font-weight': 'normal'
            });
            
            $('.md\\:flex a.border-b-2').css({
                'border-bottom-color': menuItemScrollColor,
                'font-weight': 'bold'
            });
        } else {
            updateNavbarColor();
        }
    });

    $(document).on('click', function(event) {
        if (!$(event.target).closest('#mobile-menu').length && !$(event.target).closest('#menu-toggle').length) {
            $('#mobile-menu').addClass('hidden');
            updateNavbarColor();
        }
    });

    const navbarStartColor = 'transparent';
    const navbarScrollColor = 'var(--school-program-bg-yellow)';
    const menuItemStartColor = 'white';
    const menuItemScrollColor = '#222';

    function updateNavbarColor() {
        const scrolled = $(window).scrollTop() > 50;
        const mobileMenuOpen = !$('#mobile-menu').hasClass('hidden');
        
        const shouldUseScrollColor = scrolled || mobileMenuOpen;
        
        $('#navbar').css({
            'background': shouldUseScrollColor ? navbarScrollColor : navbarStartColor,
            'box-shadow': shouldUseScrollColor ? '0 2px 16px rgba(0,0,0,0.08)' : 'none',
            'transition': 'background 0.4s, box-shadow 0.4s'
        });

        if (mobileMenuOpen) {
            $('#mobile-menu').css({
                'background': navbarScrollColor,
                'transition': 'background 0.4s'
            });
        }

        $('#menu-toggle span').css({
            'color': shouldUseScrollColor ? 'var(--school-text-color-dark)' : 'white',
            'transition': 'color 0.4s'
        });
        
        $('.md\\:hidden svg').css({
            'color': shouldUseScrollColor ? 'var(--school-text-color-dark)' : 'white',
            'transition': 'color 0.4s'
        });

        $('.md\\:flex a').css({
            'color': shouldUseScrollColor ? menuItemScrollColor : menuItemStartColor,
            'transition': 'color 0.4s',
            'font-weight': 'normal'
        });

        $('.md\\:flex a.border-b-2').css({
            'border-bottom-color': shouldUseScrollColor ? menuItemScrollColor : menuItemStartColor,
            'font-weight': 'bold'
        });

        $('.md\\:flex a').hover(
            function() {
                $(this).css('border-bottom-color', shouldUseScrollColor ? menuItemScrollColor : menuItemStartColor);
            },
            function() {
                $(this).css('border-bottom-color', shouldUseScrollColor ? menuItemScrollColor : menuItemStartColor);
            }
        );

        $('#mobile-menu a').css({
            'color': 'var(--school-text-color-dark)',
            'transition': 'color 0.4s',
            'font-weight': 'normal'
        });
        $('#mobile-menu a.border-b-2').css({
            'font-weight': 'bold',
            'border-bottom-color': 'var(--school-text-color-dark)'
        });
    }

    $(window).on('scroll', updateNavbarColor);
    $(document).ready(updateNavbarColor);
    
    function changeLanguage(lang) {
        console.log("Changing language to:", lang);
        
        const form = document.createElement('form');
        form.method = 'post';
        form.action = '/i18n/setlang/';
        form.style.display = 'none';
        
        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = 'csrfmiddlewaretoken';
        csrfInput.value = '{{ csrf_token }}';
        
        const langInput = document.createElement('input');
        langInput.type = 'hidden';
        langInput.name = 'language';
        langInput.value = lang;
        
        let nextPath = window.location.pathname;
        if (lang === 'en' && nextPath.startsWith('/pt-br/')) {
            nextPath = nextPath.replace('/pt-br/', '/');
        }
        
        const nextInput = document.createElement('input');
        nextInput.type = 'hidden';
        nextInput.name = 'next';
        nextInput.value = nextPath;
        
        console.log("Form action:", form.action);
        console.log("Language value:", lang);
        console.log("Next URL:", nextPath);
        
        form.appendChild(csrfInput);
        form.appendChild(langInput);
        form.appendChild(nextInput);
        
        document.body.appendChild(form);
        form.submit();
    }
    
    $('#en-flag').on('click', function() {
        changeLanguage('en');
    });
    
    $('#pt-flag').on('click', function() {
        changeLanguage('pt-br');
    });
    
    $('#en-flag-mobile').on('click', function() {
        changeLanguage('en');
    });
    
    $('#pt-flag-mobile').on('click', function() {
        changeLanguage('pt-br');
    });
    
    function updateFlagStyles() {
        const scrolled = $(window).scrollTop() > 50;
        
        if (scrolled) {
            $('.flag-btn').addClass('border-gray-800/30').removeClass('border-white/30');
            $('.flag-btn.ring-2').addClass('ring-gray-800').removeClass('ring-white');
        } else {
            $('.flag-btn').addClass('border-white/30').removeClass('border-gray-800/30');
            $('.flag-btn.ring-2').addClass('ring-white').removeClass('ring-gray-800');
        }
    }
    
    $(window).on('scroll', updateFlagStyles);
    $(document).ready(updateFlagStyles);
</script>
