<!DOCTYPE html>
<html>
<head>
    <title>Language Switcher Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Language Switcher Test</h1>
    
    <div>
        <button id="en-flag">English</button>
        <button id="pt-flag">Português</button>
    </div>
    
    <div id="debug-output" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px;">
        <h2>Debug Output:</h2>
        <pre id="log"></pre>
    </div>
    
    <script>
        function log(message) {
            const logElement = document.getElementById('log');
            logElement.textContent += message + '\n';
            console.log(message);
        }
        
        function testChangeLanguage(lang) {
            log(`Testing language change to: ${lang}`);
            
            // Create form for POST submission
            const form = document.createElement('form');
            form.method = 'post';
            form.action = '/i18n/setlang/';
            
            // Log form details
            log(`Form action: ${form.action}`);
            log(`Form method: ${form.method}`);
            
            // Add language selection
            const langInput = document.createElement('input');
            langInput.type = 'hidden';
            langInput.name = 'language';
            langInput.value = lang;
            log(`Language input value: ${langInput.value}`);
            
            // Add next parameter
            const nextInput = document.createElement('input');
            nextInput.type = 'hidden';
            nextInput.name = 'next';
            nextInput.value = window.location.pathname;
            log(`Next URL: ${nextInput.value}`);
            
            log('Form would be submitted with these values.');
        }
        
        // Event listeners
        $('#en-flag').on('click', function() {
            testChangeLanguage('en');
        });
        
        $('#pt-flag').on('click', function() {
            testChangeLanguage('pt_BR');
        });
        
        // Log initial state
        log('Language switcher test page loaded.');
        log(`Current URL: ${window.location.href}`);
    </script>
</body>
</html>
